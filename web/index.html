<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rusty VTT — Table de jeu</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/advanced/advanced.css"></head><body>
<header><a class="brand" href="#" title="Rusty Virtual Tabletop"><span class="brand-crest">R</span><span>RUSTY<small>VIRTUAL TABLETOP</small></span></a><div class="world"><span id="world-name">Rusty VTT</span></div><button id="identity" title="Changer de joueur">Connexion</button></header>
<main><section class="table"><div class="scene-bar"><button id="nav-toggle" title="Réduire les scènes" aria-label="Réduire les scènes">▾</button><div id="scenes"></div><button id="new-scene" title="Créer une scène">＋</button><span class="scene-hint"></span></div>
<div class="viewport"><canvas id="map" aria-label="Carte de la scène"></canvas><div class="map-title"><h1 id="scene-title">Table de jeu</h1><p id="scene-info"></p></div>
<nav class="control-groups" aria-label="Calques de scène"><button data-group="select" class="active" data-icon="person" title="Contrôles des pions" aria-label="Contrôles des pions"></button><button data-group="ruler" data-icon="ruler" title="Mesures" aria-label="Mesures"></button><button data-group="wall" data-icon="wall" title="Contrôles des murs" aria-label="Contrôles des murs"></button><button data-group="fog" data-icon="eye" title="Brouillard de guerre" aria-label="Brouillard de guerre"></button><button data-group="note" data-icon="book" title="Notes de journal" aria-label="Notes de journal"></button></nav>
<nav class="tools" aria-label="Outils de carte"><button data-tool="select" class="selected" data-icon="cursor" title="Sélectionner et déplacer" aria-label="Sélectionner et déplacer"></button><button data-tool="pan" data-icon="hand" title="Déplacer la carte" aria-label="Déplacer la carte"></button><button data-tool="token" data-icon="plus-person" title="Ajouter un pion" aria-label="Ajouter un pion"></button><button data-tool="ruler" data-icon="ruler" title="Mesurer" aria-label="Mesurer"></button><button data-tool="wall" data-icon="wall" title="Tracer un mur" aria-label="Tracer un mur"></button><button data-tool="fog" data-icon="eye" title="Cacher une zone" aria-label="Cacher une zone"></button><button data-tool="note" data-icon="pin" title="Placer une note" aria-label="Placer une note"></button></nav>
<div class="map-footer"><span id="tool-status">Sélectionner un pion</span><div><button id="zoom-out" title="Dézoomer">−</button><span id="zoom">100%</span><button id="zoom-in" title="Zoomer">＋</button><button id="center" title="Cadrer la scène">⌖</button></div></div><div class="map-legend"><i></i><span id="connection-status">Connexion à la table…</span></div></div></section>
<aside id="sidebar"><nav class="tabs" aria-label="Panneaux de jeu"><button data-tab="chat" class="active" data-icon="chat" title="Conversation" aria-label="Conversation"></button><button data-tab="combat" data-icon="swords" title="Rencontre" aria-label="Rencontre"></button><button data-tab="scenes" data-icon="map" title="Scènes" aria-label="Scènes"></button><button data-tab="actors" data-icon="people" title="Personnages" aria-label="Personnages"></button><button data-tab="items" data-icon="bag" title="Objets" aria-label="Objets"></button><button data-tab="journals" data-icon="book" title="Journal" aria-label="Journal"></button><button data-tab="audio" data-icon="music" title="Ambiance" aria-label="Ambiance"></button><button data-tab="compendiums" data-icon="library" title="Compendiums" aria-label="Compendiums"></button><button data-tab="settings" data-icon="gear" title="Paramètres" aria-label="Paramètres"></button><button id="sidebar-toggle" title="Réduire le panneau" aria-label="Réduire le panneau">›</button></nav>
<div class="panel-head"><div><span id="panel-kicker"></span><h2 id="panel-title">Conversation</h2></div><button id="panel-add" title="Créer un document">＋ Créer</button></div><div class="directory-search"><span data-icon="search"></span><input id="directory-search" type="search" placeholder="Rechercher…" aria-label="Rechercher dans le panneau"></div><div id="panel-body"></div>
<div id="chat-compose"><div class="chat-controls"><span data-icon="dice"></span><span>Message public</span><span class="chat-mode">Tous les joueurs</span></div><div class="dice-bar"><button data-dice="1d4">d4</button><button data-dice="1d6">d6</button><button data-dice="1d8">d8</button><button data-dice="1d10">d10</button><button data-dice="1d12">d12</button><button data-dice="1d20">d20</button><button data-dice="1d100">d100</button></div><form id="chat-form"><textarea id="message" rows="3" placeholder="Saisir un message ou /r 1d20+5" aria-label="Message"></textarea><div><span>Entrée : envoyer · Maj+Entrée : nouvelle ligne</span><button type="submit" title="Envoyer le message" aria-label="Envoyer le message" data-icon="send"></button></div></form></div><footer class="aside-footer"><span>Rusty VTT</span><span>Table de jeu</span></footer></aside></main>
<section id="players" aria-label="Joueur connecté"><div class="players-title"><span data-icon="people"></span>Joueurs<button id="players-toggle" title="Réduire la liste des joueurs">▾</button></div><div class="player-row"><i></i><span id="user-info">Hors connexion</span><span id="player-role"></span></div></section>
<nav id="hotbar" aria-label="Barre de raccourcis de dés"><button id="hotbar-lock" data-icon="unlock" title="Verrouiller les raccourcis" aria-label="Verrouiller les raccourcis"></button><div id="macro-slots"></div><div class="hotbar-pages"><button id="hotbar-prev" aria-label="Page précédente">▴</button><span id="hotbar-page">1</span><button id="hotbar-next" aria-label="Page suivante">▾</button></div></nav>
<div id="toast" role="status"></div><dialog id="modal"><form id="modal-form"><div class="window-title"><h2 id="modal-title"></h2><button type="button" class="close" title="Fermer" aria-label="Fermer">×</button></div><div id="modal-fields"></div><p id="modal-error"></p><button class="primary" type="submit">Enregistrer</button></form></dialog><script src="app.js"></script><script src="modules-ui.js"></script><script src="builder-ui.js"></script><script src="/advanced/scene-ui.js"></script><script src="/advanced/effects-ui.js"></script><script src="/advanced/chat-ui.js"></script></body></html>

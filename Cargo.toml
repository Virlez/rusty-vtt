[package]
name = "rusty-vtt"
version = "0.1.0"
edition = "2024"
description = "Table de jeu de rôle virtuelle indépendante en Rust"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

